<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAGS Admin | Chocolate Avenue Grooming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
      .glass {
        backdrop-filter: blur(16px);
        background: rgba(255, 255, 255, 0.75);
      }
      .booking-card {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .booking-card:hover {
        transform: translateY(-4px);
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-amber-50 via-white to-orange-100 text-gray-800 font-sans"
  >
    <!-- LOGIN VIEW -->
    <section
      id="loginView"
      class="min-h-screen flex items-center justify-center p-6"
    >
      <div
        class="w-full max-w-md bg-white/80 glass border border-white rounded-[2rem] shadow-2xl p-10"
      >
        <div class="text-center mb-8">
          <div
            class="inline-flex items-center justify-center w-16 h-16 bg-amber-600 text-white rounded-2xl mb-4 shadow-lg shadow-amber-200"
          >
            <i class="fa-solid fa-paw text-2xl"></i>
          </div>
          <h1 class="text-3xl font-black text-gray-900">Admin Login</h1>
          <p class="text-gray-500 mt-2">Chocolate Avenue Grooming Salon</p>
        </div>
        <form id="loginForm" class="space-y-5">
          <input
            id="email"
            type="text"
            placeholder="Admin Email (cagsdogs@gmail.com)"
            class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition"
            required
          />
          <input
            id="password"
            type="password"
            placeholder="Password"
            class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none transition"
            required
          />
          <button
            type="submit"
            class="w-full bg-amber-600 hover:bg-amber-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-amber-200 transition-all active:scale-[0.98]"
          >
            Sign In
          </button>
        </form>
        <p
          id="loginMsg"
          class="mt-4 text-center text-red-500 text-sm font-medium"
        ></p>
      </div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboardView" class="hidden">
      <header
        class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-white/60"
      >
        <div
          class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4"
        >
          <div>
            <h1 class="text-2xl font-black text-gray-900 tracking-tight">
              CAGS Dashboard
            </h1>
            <p
              id="adminEmailLabel"
              class="text-sm text-amber-700 font-medium"
            ></p>
          </div>
          <div class="flex items-center gap-3">
            <button
              id="addAppointmentBtn"
              class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold transition flex items-center gap-2"
            >
              <i class="fa-solid fa-plus"></i> Add Appointment
            </button>
            <button
              id="logoutBtn"
              class="px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-red-50 hover:text-red-600 font-bold transition"
            >
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- STATS BAR -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          <div class="bg-white p-6 rounded-3xl border border-white shadow-sm">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">
              Total
            </p>
            <p id="statsTotal" class="text-3xl font-black mt-1">0</p>
          </div>
          <div class="bg-white p-6 rounded-3xl border border-white shadow-sm">
            <p
              class="text-amber-500 text-xs font-bold uppercase tracking-wider"
            >
              Pending
            </p>
            <p id="statsPending" class="text-3xl font-black mt-1">0</p>
          </div>
          <div
            class="bg-white p-6 rounded-3xl border border-white shadow-sm text-green-600"
          >
            <p
              class="text-green-500 text-xs font-bold uppercase tracking-wider"
            >
              Approved
            </p>
            <p id="statsApproved" class="text-3xl font-black mt-1">0</p>
          </div>
          <div
            class="bg-white p-6 rounded-3xl border border-white shadow-sm text-red-600"
          >
            <p class="text-red-500 text-xs font-bold uppercase tracking-wider">
              Rejected
            </p>
            <p id="statsRejected" class="text-3xl font-black mt-1">0</p>
          </div>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
          <div class="relative flex-1">
            <i
              class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              id="searchInput"
              type="text"
              placeholder="Search customer name, email, phone..."
              class="w-full pl-12 pr-5 py-4 rounded-2xl bg-white border-none shadow-sm focus:ring-2 focus:ring-amber-500 outline-none"
            />
          </div>
          <select
            id="statusFilter"
            class="px-6 py-4 rounded-2xl bg-white border-none shadow-sm font-bold text-gray-600 outline-none"
          >
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <!-- BOOKING LIST -->
        <div
          id="bookingList"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </main>
    </section>

    <!-- ADD APPOINTMENT MODAL -->
    <div
      id="addModal"
      class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
      >
        <div class="p-8">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-gray-900">
              Add New Appointment
            </h2>
            <button
              id="closeAddModal"
              class="text-gray-400 hover:text-gray-700 text-2xl"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <form id="addAppointmentForm" class="space-y-4">
            <div>
              <label class="block font-semibold mb-2 text-sm"
                >Customer Name</label
              >
              <input
                type="text"
                name="name"
                required
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none"
              />
            </div>
            <div>
              <label class="block font-semibold mb-2 text-sm">Email</label>
              <input
                type="email"
                name="email"
                required
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none"
              />
            </div>
            <div>
              <label class="block font-semibold mb-2 text-sm">Phone</label>
              <input
                type="tel"
                name="phone"
                required
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block font-semibold mb-2 text-sm">Date</label>
                <input
                  type="date"
                  name="date"
                  required
                  class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none"
                />
              </div>
              <div>
                <label class="block font-semibold mb-2 text-sm">Time</label>
                <select
                  name="time"
                  required
                  class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none bg-white"
                >
                  <option value="">Select time</option>
                  <option value="09:00">9:00 AM</option>
                  <option value="10:00">10:00 AM</option>
                  <option value="11:00">11:00 AM</option>
                  <option value="12:00">12:00 PM</option>
                  <option value="13:00">1:00 PM</option>
                  <option value="14:00">2:00 PM</option>
                  <option value="15:00">3:00 PM</option>
                  <option value="16:00">4:00 PM</option>
                  <option value="17:00">5:00 PM</option>
                  <option value="18:00">6:00 PM</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block font-semibold mb-2 text-sm">Status</label>
              <select
                name="status"
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none bg-white"
              >
                <option value="pending">Pending</option>
                <option value="approved">Approved (auto-blocks slot)</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-2 text-sm"
                >Notes / Dog Info</label
              >
              <textarea
                name="message"
                rows="3"
                placeholder="Breed, grooming notes, etc."
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-amber-500 outline-none resize-none"
              ></textarea>
            </div>
            <div class="pt-2 flex gap-3">
              <button
                type="submit"
                id="addSubmitBtn"
                class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-2xl font-bold transition"
              >
                Add Appointment
              </button>
              <button
                type="button"
                id="cancelAddModal"
                class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-2xl font-bold transition"
              >
                Cancel
              </button>
            </div>
            <p id="addMsg" class="text-center text-sm font-medium hidden"></p>
          </form>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
        updateDoc,
        deleteDoc,
        doc,
        setDoc,
        addDoc,
        deleteDoc as firestoreDeleteDoc,
      } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDGboX-vIjRHG8c1WH96-ggXFTp6MwVFCk",
        authDomain: "chocolate-avenue-grooming.firebaseapp.com",
        projectId: "chocolate-avenue-grooming",
        storageBucket: "chocolate-avenue-grooming.firebasestorage.app",
        messagingSenderId: "598219200758",
        appId: "1:598219200758:web:715700a519b5ace9aff4d7",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      emailjs.init("KmW8d6wt0pthfowkY");

      const state = { bookings: [], filter: "all", search: "" };

      // --- HELPERS ---
      const fmtTime = (t) => {
        if (!t) return "N/A";
        const [h, m] = t.split(":").map(Number);
        return `${h % 12 || 12}:${m.toString().padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`;
      };
      const fmtDate = (d) =>
        d
          ? new Date(d.replace(/-/g, "/")).toLocaleDateString("en-US", {
              weekday: "short",
              month: "short",
              day: "numeric",
            })
          : "N/A";
      const prettyDate = (d) =>
        d
          ? new Date(d.replace(/-/g, "/")).toLocaleDateString("en-US", {
              weekday: "long",
              year: "numeric",
              month: "long",
              day: "numeric",
            })
          : "N/A";
      const getBadgeClass = (s) => {
        if (s === "approved")
          return "bg-green-100 text-green-700 border-green-200";
        if (s === "rejected") return "bg-red-100 text-red-700 border-red-200";
        return "bg-amber-100 text-amber-700 border-amber-200";
      };

      // --- AVAILABILITY ---
      const availId = (date, time) => `${date}_${time}`;

      async function blockTimeSlot(booking) {
        const slotId = availId(booking.date, booking.time);
        await setDoc(doc(db, "availability", slotId), {
          date: booking.date,
          time: booking.time,
          bookedBy: booking.name || "Unknown",
          bookedEmail: booking.email || "",
          appointmentId: booking.id || "",
          blocked: true,
          blockedAt: new Date().toISOString(),
        });
      }

      async function unblockTimeSlot(booking) {
        const slotId = availId(booking.date, booking.time);
        try {
          await firestoreDeleteDoc(doc(db, "availability", slotId));
        } catch (err) {
          console.warn("Could not unblock slot:", err.message);
        }
      }

      // --- SEND APPROVAL EMAIL via EmailJS ---
      // Uses template ID: template_approval  (you'll create this in EmailJS — see below)
      async function sendApprovalEmail(booking) {
        try {
          await emailjs.send("service_xfesk05", "template_ht3z1vd", {
            to_name: booking.name,
            to_email: booking.email,
            phone: booking.phone || "N/A",
            dog_info: booking.message || "N/A",
            appt_date: prettyDate(booking.date),
            appt_time: fmtTime(booking.time),
          });
          console.log("Approval email sent to", booking.email);
        } catch (err) {
          console.warn(
            "Approval email failed (booking still approved):",
            err.message,
          );
        }
      }

      // --- BOOKING LIST ACTIONS ---
      document
        .getElementById("bookingList")
        .addEventListener("click", async (e) => {
          const btn = e.target.closest("button[data-id]");
          if (!btn) return;
          const { id, action } = btn.dataset;
          const docRef = doc(db, "appointments", id);
          const booking = state.bookings.find((b) => b.id === id);

          try {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

            if (action === "delete") {
              if (confirm("Permanently delete this record?")) {
                if (booking?.status === "approved")
                  await unblockTimeSlot(booking);
                await deleteDoc(docRef);
              } else {
                updateUI();
              }
            } else if (action === "approve") {
              await updateDoc(docRef, { status: "approved" });
              if (booking) {
                await blockTimeSlot(booking);
                await sendApprovalEmail(booking);
              }
            } else if (action === "reject") {
              if (booking?.status === "approved")
                await unblockTimeSlot(booking);
              await updateDoc(docRef, { status: "rejected" });
            } else if (action === "pending") {
              if (booking?.status === "approved")
                await unblockTimeSlot(booking);
              await updateDoc(docRef, { status: "pending" });
            }
          } catch (err) {
            alert("Error: " + err.message);
            updateUI();
          }
        });

      // --- ADD APPOINTMENT MODAL ---
      const addModal = document.getElementById("addModal");
      document.getElementById("addAppointmentBtn").onclick = () =>
        addModal.classList.remove("hidden");
      document.getElementById("closeAddModal").onclick = () =>
        addModal.classList.add("hidden");
      document.getElementById("cancelAddModal").onclick = () =>
        addModal.classList.add("hidden");
      addModal.addEventListener("click", (e) => {
        if (e.target === addModal) addModal.classList.add("hidden");
      });

      document
        .getElementById("addAppointmentForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const btn = document.getElementById("addSubmitBtn");
          const msg = document.getElementById("addMsg");
          const data = Object.fromEntries(new FormData(form));

          btn.textContent = "Saving...";
          btn.disabled = true;

          try {
            const docRef = await addDoc(collection(db, "appointments"), {
              name: data.name,
              email: data.email,
              phone: data.phone,
              message: data.message || "",
              date: data.date,
              time: data.time,
              status: data.status,
            });

            // If admin is adding as approved, block the slot right away and send email
            if (data.status === "approved") {
              const booking = { id: docRef.id, ...data };
              await blockTimeSlot(booking);
              await sendApprovalEmail(booking);
            }

            msg.textContent = "✅ Appointment added!";
            msg.classList.remove("hidden", "text-red-600");
            msg.classList.add("text-green-600");
            form.reset();
            setTimeout(() => {
              msg.classList.add("hidden");
              addModal.classList.add("hidden");
            }, 1500);
          } catch (err) {
            msg.textContent = "❌ Error: " + err.message;
            msg.classList.remove("hidden", "text-green-600");
            msg.classList.add("text-red-600");
          } finally {
            btn.textContent = "Add Appointment";
            btn.disabled = false;
          }
        });

      // --- LOGIN ---
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const pass = document.getElementById("password").value;
          try {
            await signInWithEmailAndPassword(auth, email, pass);
          } catch (err) {
            document.getElementById("loginMsg").textContent =
              "Login Failed: Check credentials.";
          }
        });

      document.getElementById("logoutBtn").onclick = () => signOut(auth);

      // --- RENDERING ---
      function updateUI() {
        const rows = state.bookings.filter((b) => {
          const matchStatus =
            state.filter === "all" || b.status === state.filter;
          const q = state.search.toLowerCase();
          const matchSearch = !q || JSON.stringify(b).toLowerCase().includes(q);
          return matchStatus && matchSearch;
        });

        document.getElementById("statsTotal").textContent =
          state.bookings.length;
        document.getElementById("statsPending").textContent =
          state.bookings.filter(
            (x) => x.status === "pending" || !x.status,
          ).length;
        document.getElementById("statsApproved").textContent =
          state.bookings.filter((x) => x.status === "approved").length;
        document.getElementById("statsRejected").textContent =
          state.bookings.filter((x) => x.status === "rejected").length;

        document.getElementById("bookingList").innerHTML =
          rows
            .map(
              (b) => `
            <article class="booking-card bg-white border border-gray-100 rounded-[2rem] shadow-sm p-6 flex flex-col">
              <div class="flex justify-between items-start mb-4">
                <div>
                  <h3 class="text-xl font-black text-gray-900">${b.name || "Anonymous"}</h3>
                  <p class="text-sm text-gray-500 font-medium">${b.email || ""}</p>
                  ${b.phone ? `<p class="text-sm text-gray-400">${b.phone}</p>` : ""}
                </div>
                <span class="px-3 py-1 rounded-full border text-[10px] font-black uppercase tracking-widest ${getBadgeClass(b.status || "pending")}">
                  ${b.status || "pending"}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gray-50 p-3 rounded-2xl"><p class="text-[10px] font-bold text-gray-400 uppercase">Date</p><p class="font-bold text-sm">${fmtDate(b.date)}</p></div>
                <div class="bg-gray-50 p-3 rounded-2xl"><p class="text-[10px] font-bold text-gray-400 uppercase">Time</p><p class="font-bold text-sm">${fmtTime(b.time)}</p></div>
              </div>
              <p class="text-sm text-gray-600 italic bg-amber-50/50 p-3 rounded-xl border border-amber-100/50 mb-6 flex-grow">
                "${b.message || "No message provided."}"
              </p>
              <div class="flex gap-2">
                ${b.status !== "approved" ? `<button data-action="approve" data-id="${b.id}" class="flex-1 bg-green-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-green-700 transition">Approve</button>` : ""}
                ${b.status !== "rejected" ? `<button data-action="reject" data-id="${b.id}" class="flex-1 bg-red-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-red-700 transition">Reject</button>` : ""}
                ${b.status === "approved" || b.status === "rejected" ? `<button data-action="pending" data-id="${b.id}" class="flex-1 bg-amber-500 text-white py-3 rounded-xl text-xs font-bold hover:bg-amber-600 transition">Reset</button>` : ""}
                <button data-action="delete" data-id="${b.id}" class="w-12 bg-gray-900 text-white py-3 rounded-xl hover:bg-black transition"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </article>
          `,
            )
            .join("") ||
          '<div class="col-span-full text-center py-20 text-gray-400 font-medium">No records found.</div>';
      }

      document.getElementById("searchInput").oninput = (e) => {
        state.search = e.target.value;
        updateUI();
      };
      document.getElementById("statusFilter").onchange = (e) => {
        state.filter = e.target.value;
        updateUI();
      };

      // --- AUTH ---
      onAuthStateChanged(auth, (user) => {
        if (user) {
          document.getElementById("loginView").classList.add("hidden");
          document.getElementById("dashboardView").classList.remove("hidden");
          document.getElementById("adminEmailLabel").textContent = user.email;

          onSnapshot(
            collection(db, "appointments"),
            (snap) => {
              state.bookings = snap.docs.map((d) => ({
                id: d.id,
                ...d.data(),
              }));
              updateUI();
            },
            (err) => console.error("Sync Error:", err),
          );
        } else {
          document.getElementById("loginView").classList.remove("hidden");
          document.getElementById("dashboardView").classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
